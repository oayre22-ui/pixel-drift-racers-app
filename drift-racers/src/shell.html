<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pixel Drift Racers</title>
<style>
:root{
  --bg:#0d0b1e; --panel:#1a1636; --panel2:#241f4a; --line:#3d3672; --ink:#f4f1ff; --dim:#9a93c9;
  --hot:#ff3d7f; --cyan:#3df2ff; --gold:#ffd23d; --green:#5dff6a; --red:#ff4d4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Courier New",Courier,monospace;font-weight:bold;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(13,11,30,.82),rgba(13,11,30,.94));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.clear{background:linear-gradient(90deg,rgba(13,11,30,.9) 0%,rgba(13,11,30,.55) 55%,rgba(13,11,30,.1) 100%)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;letter-spacing:2px;text-transform:uppercase;text-shadow:3px 3px 0 #000}
.cash{margin-left:auto;color:var(--gold);font-size:18px;text-shadow:2px 2px 0 #000;white-space:nowrap}
button,.btn{font:inherit;color:var(--ink);background:var(--panel2);border:3px solid var(--line);border-bottom-width:5px;padding:8px 14px;
  text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-radius:0;font-size:14px;box-shadow:0 0 0 2px #000}
button:hover{border-color:var(--cyan)}
button:active{transform:translateY(2px);border-bottom-width:3px}
button.hot{background:var(--hot);border-color:#ff8fb5;color:#fff}
button.gold{background:#b98a00;border-color:var(--gold)}
button.ok{background:#1f7a33;border-color:var(--green)}
button:disabled{opacity:.4;cursor:default}
button.sel{border-color:var(--gold);background:#3a3070}
.title{font-size:clamp(34px,8vw,72px);margin:0;line-height:.95;letter-spacing:3px;color:var(--ink);
  text-shadow:4px 4px 0 var(--hot),8px 8px 0 #000}
.title span{color:var(--cyan)}
.menu{display:flex;flex-direction:column;gap:8px;max-width:300px;margin-top:16px}
.menu button{font-size:17px;padding:11px 16px;text-align:left}
.sub{color:var(--dim);font-size:13px;margin-top:6px;text-shadow:1px 1px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel);border:3px solid var(--line);padding:10px;box-shadow:0 0 0 2px #000;position:relative}
.card h3{margin:0 0 4px;font-size:16px;text-transform:uppercase}
.card .meta{color:var(--dim);font-size:12px;line-height:1.5}
.badge{display:inline-block;padding:1px 6px;font-size:11px;border:2px solid;margin-right:4px;text-transform:uppercase}
.b-drift{color:var(--hot);border-color:var(--hot)}
.b-race{color:var(--cyan);border-color:var(--cyan)}
.b-tandem{color:var(--gold);border-color:var(--gold)}
.b-free{color:var(--green);border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:flex;gap:12px;flex:1;min-height:0}
.split>.left{flex:1 1 52%;display:flex;flex-direction:column;min-width:0}
.split>.right{flex:1 1 48%;overflow-y:auto;min-width:0;touch-action:pan-y}
@media (max-width:700px) and (orientation:portrait){.split{flex-direction:column}.split>.right{overflow:visible}}
.preview{background:repeating-linear-gradient(0deg,#141130 0 8px,#17143a 8px 16px);border:3px solid var(--line);box-shadow:0 0 0 2px #000;
  display:flex;align-items:center;justify-content:center;min-height:150px;flex:1;max-height:52vh;position:relative;overflow:hidden}
.preview canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
.preview .pname{position:absolute;left:8px;top:6px;font-size:18px;text-transform:uppercase;text-shadow:2px 2px 0 #000}
.preview .pr{position:absolute;right:8px;top:6px;color:var(--gold);font-size:16px;text-shadow:2px 2px 0 #000}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;font-size:12px;margin-top:8px;align-items:center}
.bar{height:8px;background:#0a0818;border:2px solid #000;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--green);opacity:.85}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);padding:6px 8px;box-shadow:0 0 0 2px #000}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--dim);font-size:11px;font-weight:normal}
.item.on{border-color:var(--green)}
.price{color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:6px 10px;font-size:12px}
.pgroup{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pgroup>span{font-size:10px;color:var(--dim);width:62px;text-transform:uppercase;flex:none}
.pgroup .tabs{margin:0}
.pgroup button{padding:4px 7px;font-size:11px}
.pgroup button.up{color:var(--green)}
.screen.workshop,.screen.lot{background-size:cover;background-position:center bottom;image-rendering:pixelated}
.screen.lot{background-size:192px;background-repeat:repeat;background-position:0 0}
.preview.bay{background:rgba(10,8,20,.35)}
.lothead{text-align:center;margin:0 0 10px}
.lothead .flags{height:24px;background-size:80px 24px;background-repeat:repeat-x;image-rendering:pixelated}
.lotsign{display:inline-block;margin:4px 0;padding:6px 16px;background:#1a1636;border:4px solid var(--gold);font-size:clamp(18px,4vw,28px);letter-spacing:3px;
  box-shadow:0 0 0 3px #000,0 0 18px rgba(255,210,61,.35);text-shadow:2px 2px 0 var(--hot)}
.lotsign span{color:var(--cyan)}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));row-gap:34px;padding-bottom:20px}
.stall{position:relative;height:160px;border-left:3px solid #e6e6ea;border-top:3px solid #e6e6ea;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;padding-top:8px}
.stall:last-child{border-right:3px solid #e6e6ea}
.stall:hover .spot canvas,.stall.sel .spot canvas{filter:drop-shadow(0 0 6px var(--gold))}
.stall .spot{height:100px;display:flex;align-items:center;justify-content:center}
.stall .spot canvas{image-rendering:pixelated}
.stall .lbl{font-size:11px;text-shadow:2px 2px 0 #000;margin-top:4px;text-align:center}
.stall .tag{margin-top:3px;background:#f4f1ff;color:#111;padding:1px 6px;font-size:12px;border:2px solid #000;box-shadow:2px 2px 0 #000}
.stall .tag.poor{background:#ffb3b3}
.stall .tag.own{background:var(--green)}
.lotcard{position:absolute;inset:0;background:rgba(5,4,14,.7);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.lotcard .panel{background:var(--panel);border:4px solid var(--gold);box-shadow:0 0 0 3px #000;padding:12px;width:min(860px,100%);max-height:100%;overflow-y:auto}
.lotcard .preview{min-height:170px;height:100%}
.lotprice{font-size:28px;color:var(--gold);text-shadow:3px 3px 0 #000;margin-bottom:4px}
.slider{background:var(--panel);border:3px solid var(--line);padding:6px 8px;box-shadow:0 0 0 2px #000}
.slider .lab{display:flex;justify-content:space-between;font-size:13px}
.slider .lab small{color:var(--dim);font-weight:normal}
.slider input{width:100%;accent-color:var(--hot);touch-action:pan-x}
.slider.locked{opacity:.5}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:30px;height:30px;border:3px solid #000;cursor:pointer;box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--gold)}
/* HUD */
.hud{position:absolute;pointer-events:none;font-size:14px;text-shadow:2px 2px 0 #000}
.hud .tl{position:absolute;left:8px;top:6px;line-height:1.35}
.hud .tr{position:absolute;right:8px;top:6px;text-align:right;line-height:1.35}
.hud .big{font-size:24px}
.hud .spd{position:absolute;right:10px;bottom:8px;text-align:right}
.hud .spd .v{font-size:34px;line-height:1}
.hud .rpm{width:120px;height:8px;border:2px solid #000;background:#111;margin-top:3px;margin-left:auto}
.hud .rpm i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold) 70%,var(--red))}
.hud .nos{width:120px;height:6px;border:2px solid #000;background:#111;margin-top:3px;margin-left:auto}
.hud .nos i{display:block;height:100%;background:var(--cyan)}
.hud .drift{position:absolute;left:0;right:0;top:34px;text-align:center}
.hud .drift .pts{font-size:28px;color:var(--gold)}
.hud .drift .mul{font-size:16px;color:var(--hot)}
.hud .drift .tot{font-size:13px;color:var(--ink)}
.hud .msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:44px;color:var(--ink);text-shadow:4px 4px 0 var(--hot),6px 6px 0 #000}
.hud .pop{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:18px}
#hud.touchmode .spd{bottom:auto;top:64px}
#hud.touchmode .spd .v{font-size:26px}
.hud .tut{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(520px,60vw);background:rgba(26,22,54,.92);border:3px solid var(--cyan);
  padding:8px 12px;box-shadow:0 0 0 2px #000;text-align:left;text-shadow:none}
.hud .tut:empty{display:none}
.hud .tut.ok{border-color:var(--green)}
.hud .tut .tstep{font-size:11px;color:var(--dim)}
.hud .tut .ttitle{font-size:17px;color:var(--cyan);text-transform:uppercase}
.hud .tut .ttext{font-size:13px;font-weight:normal;line-height:1.45;margin-top:2px}
#hud.touchmode .tut{bottom:auto;top:40px;width:min(380px,44vw);padding:5px 8px}
#hud.touchmode .tut .ttitle{font-size:14px}
#hud.touchmode .tut .ttext{font-size:11px}
#pauseBtn{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:4px 10px;font-size:12px;z-index:5}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.show{display:block}
#touch .tb{position:absolute;pointer-events:auto;background:rgba(36,31,74,.55);border:3px solid rgba(255,255,255,.35);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:2px 2px 0 #000;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#touch .tb.on{background:rgba(255,61,127,.6);border-color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:3px solid var(--gold);padding:8px 14px;z-index:20;pointer-events:none;box-shadow:0 0 0 2px #000}
.portrait-hint{display:none;color:var(--gold);font-size:12px;margin-top:8px}
@media (orientation:portrait) and (pointer:coarse){.portrait-hint{display:block}}
.res-big{font-size:clamp(30px,7vw,56px);text-shadow:4px 4px 0 var(--hot),7px 7px 0 #000;margin:4px 0}
.medal{display:inline-block;width:16px;height:16px;border:2px solid #000;vertical-align:-2px;margin-right:4px}
.m1{background:#cd7f32}.m2{background:#c0c0c0}.m3{background:#ffd23d}.m0{background:#333}
kbd{background:#000;border:2px solid var(--line);padding:0 4px;font-size:11px}

.screen.shop{background-size:cover;background-position:center bottom;image-rendering:pixelated}
.shopwrap{display:flex;gap:12px;flex:1;min-height:0}
.shopwrap>.side{flex:0 0 250px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.shopwrap>.main{flex:1;min-width:0;overflow-y:auto;touch-action:pan-y}
@media (max-width:760px){.shopwrap{flex-direction:column;overflow-y:auto}.shopwrap>.side{flex:none;overflow:visible}.shopwrap>.main{overflow:visible}.shopwrap>.side>button{display:none}}
.focus{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:12px;align-items:center}
.focus .bar{height:10px;background:#0b0920;border:2px solid #000}
.focus .bar i{display:block;height:100%}
.flabel{font-size:15px;color:var(--gold);text-shadow:2px 2px 0 #000}
.shelf{background:rgba(16,20,36,.82);border:3px solid #3c4a6a;border-bottom:7px solid #5a6a8a;box-shadow:0 0 0 2px #000;padding:6px 8px 4px;margin-bottom:10px}
.shelf h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;color:var(--dim);font-weight:normal;display:flex;gap:8px}
.shelf h4 b{color:var(--ink);font-weight:normal}
.ptiles{display:flex;gap:6px;flex-wrap:wrap}
.ptile{width:92px;cursor:pointer;background:#e9e1cf;color:#1b1b22;border:2px solid #000;box-shadow:2px 2px 0 #000;padding:4px 3px 3px;text-align:center;position:relative;font-size:10px;line-height:1.15}
.ptile:hover,.ptile.sel{outline:3px solid var(--gold)}
.ptile img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 2px}
.ptile .pn{height:24px;overflow:hidden}
.ptile .pt{margin-top:2px;background:#1b1b22;color:var(--gold);padding:1px 2px}
.ptile .pt.own{color:var(--green)}
.ptile .pt.inst{background:var(--green);color:#111}
.ptile .dot{position:absolute;right:3px;top:3px;width:8px;height:8px;border:1px solid #000}
.ptile.dim{opacity:.45}
.partcard .big{width:128px;height:128px;image-rendering:pixelated;background:#e9e1cf;border:3px solid #000;box-shadow:3px 3px 0 #000}
.cmp{display:grid;grid-template-columns:auto auto auto auto;justify-content:start;gap:3px 10px;font-size:13px;margin:8px 0}
.cmp .up{color:var(--green)}.cmp .dn{color:var(--red)}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kit{background:var(--panel);border:3px solid var(--line);padding:6px;text-align:center;cursor:pointer}
.kit.on{border-color:var(--green)}
.kit img{image-rendering:pixelated;width:100%;height:auto;background:#585766}
.kit .kn{font-size:12px;text-transform:uppercase;margin:3px 0}
.stall .was{font-size:10px;color:#fff;text-decoration:line-through;text-shadow:1px 1px 0 #000;margin-top:2px}
.lot.used .stall{border-color:#d8cdb0}
.usedsign{border-color:var(--hot);transform:rotate(-2deg)}
.usedsign span{color:var(--gold)}

#gblock{position:fixed;inset:0;z-index:35}
#ghi{position:fixed;z-index:36;pointer-events:none;border:4px solid var(--gold);box-shadow:0 0 0 3px #000,0 0 18px var(--gold);animation:ghp 1s steps(2) infinite;display:none}
@keyframes ghp{50%{border-color:var(--hot);box-shadow:0 0 0 3px #000,0 0 26px var(--hot)}}
#guide{position:fixed;right:8px;bottom:0;z-index:40;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:4px;max-width:min(680px,calc(100vw - 16px));pointer-events:none}
#guide .gchar{width:220px;height:260px;image-rendering:pixelated;flex:none;transform:scaleX(-1);filter:drop-shadow(-4px 4px 0 #000);animation:gin .35s steps(4)}
@keyframes gin{from{transform:scaleX(-1) translateY(40px);opacity:0}}
#guide .gbub{pointer-events:auto;background:#f4f1ff;color:#1b1b22;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 12px;margin-bottom:110px;position:relative;min-width:220px}
#guide .gbub:before{content:'';position:absolute;right:-14px;bottom:18px;border:7px solid transparent;border-left:9px solid #000}
#guide .gname{font-size:12px;color:var(--hot);letter-spacing:1px}
#guide .gtext{font-size:15px;line-height:1.45;min-height:3em;margin:3px 0 8px}
#guide .row{gap:6px;align-items:center;flex-wrap:wrap}
#guide button{padding:5px 10px;font-size:12px}
#guide .gstep{font-size:11px;color:#666;margin-left:auto}
@media (max-height:520px){#guide .gchar{width:140px;height:166px}#guide .gbub{margin-bottom:56px}#guide .gtext{font-size:12px;min-height:2.6em}}
@media (max-width:600px){#guide .gchar{width:110px;height:130px}}
.hud .tut{display:flex;flex-direction:row-reverse;gap:8px;align-items:flex-end;left:auto;right:10px;transform:none;bottom:96px;width:min(520px,52vw)}
.hud .tut .gface{width:132px;height:156px;image-rendering:pixelated;flex:none;margin:-70px -8px -8px 0;transform:scaleX(-1);filter:drop-shadow(-3px 3px 0 #000)}
#hud.touchmode .tut{bottom:auto;top:56px;right:10px;width:min(420px,50vw)}
#hud.touchmode .tut .gface{width:66px;height:78px;margin:-10px -6px -6px 0}
#ui>.screen{animation:scrin .16s ease-out}
@keyframes scrin{from{opacity:0;transform:translateY(6px)}}
#ui>.screen.clear{animation:none}
.hud .abar{width:160px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border:2px solid #000}
.hud .abar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--hot))}
.showcar{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:42%;height:46%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.showcar canvas{image-rendering:pixelated;max-width:100%;max-height:100%;filter:drop-shadow(0 0 14px rgba(255,61,127,.35))}
.showcar{background:radial-gradient(ellipse at center,rgba(13,11,30,.85) 35%,rgba(13,11,30,0) 70%)}
.showcar canvas{transform:rotate(-8deg)}
.showcar:after{content:'YOUR RIDE';position:absolute;bottom:6%;left:0;right:0;text-align:center;color:var(--gold);font-size:14px;letter-spacing:3px;text-shadow:2px 2px 0 #000}
.showcar .pname,.showcar .pr{display:none}
@media (max-width:760px){.showcar{display:none}}
.dyno canvas{width:100%;height:auto;image-rendering:pixelated;border:2px solid #000;margin:6px 0;display:block}
.crow{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);padding:5px 8px;margin-bottom:4px}
.crow img{width:32px;height:32px;image-rendering:pixelated;background:#e9e1cf;border:2px solid #000;flex:none}
.crow.body img{width:auto;height:28px;background:#585766}
.crow .cn{flex:1;min-width:0;font-size:13px}.crow .cn small{display:block;color:var(--dim);font-size:11px;font-weight:normal}
.crow .cbar{flex:0 0 26%;height:10px;background:#0b0920;border:2px solid #000}.crow .cbar i{display:block;height:100%}
.crow .cp{width:40px;text-align:right;font-size:13px}.crow .cok{width:74px;text-align:center;color:var(--green);font-size:12px}
.crow button{width:74px;padding:5px 4px;font-size:12px}
@media (max-width:860px){.crow .cn small{display:none}.crow .cbar{flex-basis:18%}.crow img{width:24px;height:24px}.crow .cn{font-size:11px}}
.hud .msg .alert{font-size:34px;color:#ff4d4d;text-shadow:3px 3px 0 #000;animation:alertp .3s steps(2) infinite}
@keyframes alertp{50%{color:#ffd23d}}
.screen.mech{background-size:cover;background-position:center;image-rendering:pixelated}
.lift{flex:1;min-height:180px;display:flex;align-items:center;justify-content:center}
.liftwrap{position:relative;box-shadow:0 0 0 3px #000,0 8px 24px rgba(0,0,0,.6)}
.liftwrap canvas{display:block;image-rendering:pixelated}
.liftwrap .hot{position:absolute;border:2px dashed rgba(255,255,255,.12);cursor:pointer;background:rgba(255,255,255,0);transition:background .1s}
.liftwrap .hot:hover,.liftwrap .hot.sel{background:rgba(255,255,255,.14);border:2px solid var(--zc);box-shadow:0 0 12px var(--zc)}
.liftwrap .hot.crit{animation:hotc .6s steps(2) infinite}
@keyframes hotc{50%{background:rgba(255,77,77,.3)}}
.liftwrap .hot span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;background:rgba(10,8,20,.85);color:var(--zc);padding:1px 4px;border:1px solid #000;pointer-events:none}
@media (max-width:760px){.liftwrap .hot span{font-size:9px;padding:0 2px}}
/* garage: every car in its own bay */
.gscene{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center}
.gwrap{position:relative;box-shadow:0 0 0 3px #000,0 8px 24px rgba(0,0,0,.6)}
.gwrap canvas{display:block;image-rendering:pixelated}
.gbay{position:absolute;cursor:pointer;border:2px solid transparent}
.gbay:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35)}
.gbay.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,61,.45)}
.gbay span{position:absolute;left:2px;right:2px;bottom:2px;font-size:10px;line-height:1.15;text-align:center;background:rgba(10,8,20,.82);color:var(--ink);padding:1px 2px;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gbay span b{display:block;color:var(--gold);font-weight:normal}
.gbay.empty span{color:var(--dim)}.gbay.empty span b{color:var(--green)}
.gbay span i{font-style:normal;display:block;overflow:hidden;text-overflow:ellipsis}
.gwrap.small .gbay span{font-size:9px;bottom:1px;padding:0 1px}.gwrap.small .gbay span i{display:none}
/* map pictures and online */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.mapcard{cursor:pointer;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 2px #000;position:relative}
.mapcard:hover{border-color:#8d86c8}.mapcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 14px rgba(255,210,61,.4)}
.mapimg{display:block;width:100%;aspect-ratio:12/7;object-fit:cover;border-bottom:2px solid #000;background:#151520}
.mapgrid .mapn{font-size:12px;padding:3px 5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .mapcard{padding:0}.grid .mapcard .badge,.grid .mapcard h3,.grid .mapcard .meta,.grid .mapcard .row{margin-left:10px;margin-right:10px}.grid .mapcard .row{margin-bottom:10px}
.roomcode{font-size:46px;letter-spacing:8px;color:var(--gold);text-shadow:3px 3px 0 #000;margin:4px 0;cursor:pointer}
.ninput{font:inherit;font-size:16px;padding:6px 8px;background:#151526;color:#fff;border:2px solid var(--line);width:100%;max-width:240px;box-sizing:border-box}
@media (max-width:760px){.mapgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.roomcode{font-size:34px}}
.item.srv img{width:64px;height:37px;object-fit:cover;border:2px solid #000;margin-right:8px;flex:none}
/* loading screens */
#boot{position:fixed;inset:0;z-index:50;background:#0d0b1e;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#boot.gone{opacity:0;pointer-events:none}
.bootin{text-align:center;width:min(420px,86vw)}.bootin .title{font-size:clamp(30px,8vw,56px)}
.lbar{height:14px;border:3px solid var(--line);box-shadow:0 0 0 2px #000;background:#151526;margin:18px 0 8px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--hot) 0 8px,#ff8fb5 8px 16px);transition:width .15s steps(4)}
#loadscr{position:fixed;inset:0;z-index:40;background:#0d0b1e;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#loadscr.gone{opacity:0;pointer-events:none}
.loadin{width:min(560px,92vw);text-align:center}
.loadin img{width:100%;max-height:44vh;object-fit:cover;border:3px solid var(--line);box-shadow:0 0 0 2px #000;image-rendering:auto;display:block}
.loadin h2{margin:10px 0 2px;font-size:clamp(20px,4vw,30px);text-transform:uppercase;text-shadow:3px 3px 0 #000}
.loadin .tip{color:var(--dim);font-size:13px;margin-top:6px;min-height:2.4em}
.loadin .lbar{margin:10px 0 0}
.spin{display:inline-block;width:14px;height:14px;background:var(--gold);animation:spin .6s steps(4) infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lpulse{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
@media (max-height:420px){.loadin img{max-height:38vh}.loadin h2{margin-top:6px}}
</style>
